name: Publish SciWorker test installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download existing build artifact
        env:
          ARTIFACT_URL: ${{ secrets.SCIWORKER_ARTIFACT_TRANSFER_URL }}
        run: |
          curl --fail --location --retry 2 --silent --show-error "$ARTIFACT_URL" -o artifact.zip
      - name: Verify installer checksum
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root = pathlib.Path('release')
          root.mkdir()
          with zipfile.ZipFile('artifact.zip') as archive:
              names = archive.namelist()
              for filename in ('SciWorker-Setup-8b45b431-x64.exe', 'SHA256SUMS.txt'):
                  matches = [name for name in names if pathlib.PurePosixPath(name).name == filename]
                  if len(matches) != 1:
                      raise SystemExit(f'Expected exactly one {filename}')
                  with archive.open(matches[0]) as source, (root / filename).open('wb') as target:
                      import shutil
                      shutil.copyfileobj(source, target)
          raw = (root / 'SHA256SUMS.txt').read_bytes()
          checksums = raw.decode('utf-16' if raw.startswith((b'\xff\xfe', b'\xfe\xff')) else 'utf-8-sig')
          expected, filename = checksums.strip().split(maxsplit=1)
          filename = filename.lstrip('*')
          if filename != 'SciWorker-Setup-8b45b431-x64.exe':
              raise SystemExit('Unexpected checksum filename')
          with (root / filename).open('rb') as handle:
              actual = hashlib.file_digest(handle, 'sha256').hexdigest()
          if actual.lower() != expected.lower():
              raise SystemExit('Installer SHA256 mismatch')
          (root / 'SHA256SUMS.txt').write_text(f'{actual}  {filename}\n', encoding='ascii')
          print(f'Verified SHA256: {actual}')
          PY
      - name: Publish verified test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          SciWorker Windows x64 测试安装包。

          来源：Windows installer #35，构建提交 8b45b4316e6ea29305cb79f2c903d4369110abb6。此处仅分发二进制安装包，不包含 SciWorker 私有源码。

          构建与打包检查通过；真实 Windows 安装、启动及业务验收仍待测试。本版本尚未配置 Authenticode 签名。

          下载 SciWorker-Setup-8b45b431-x64.exe 安装。SHA256SUMS.txt 可用于验证下载完整性。
          EOF
          gh release create sciworker-test-20261015-8b45b431 --draft --prerelease --title "SciWorker Windows 测试版 · 2026-10-15 · 8b45b431" --notes-file notes.md
          gh release upload sciworker-test-20261015-8b45b431 release/*
          gh release edit sciworker-test-20261015-8b45b431 --draft=false --latest=false
